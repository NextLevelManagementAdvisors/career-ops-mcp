[project]
name = "career-ops-mcp"
version = "0.1.0"
description = "Read-only MCP adapter for career-ops data with local semantic search"
readme = "README.md"
authors = [
    { name = "Eric Yoon", email = "eric.sh.yoon@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastembed>=0.8",
    "mcp>=1.2",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.7",
]

[project.scripts]
career-ops-mcp = "career_ops_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
]
